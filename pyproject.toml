[project]
name = "swarm-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "uuid7>=0.1.0",
    "litellm>=1.91.0",
    "ipykernel>=7.3.0",
    "datasets>=5.0.0",
    "pandas>=3.0.3",
    "networkx>=3.6.1",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

# ── Ruff linter + formatter configuration ───────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (use modern Python syntax)
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (needed for Pydantic)
    "N806",   # variable in function should be lowercase (conflicts with SQLite Row patterns)
    "SIM108", # ternary operator — sometimes less readable for our patterns
]

[tool.ruff.lint.isort]
known-first-party = ["swarm_memory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
